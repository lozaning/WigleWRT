# WigleWRT Sensor Node Configuration
# This file configures the sensor to report scan data to a control node

# Control node IP address (the device with GPS that receives our data)
CONTROL_NODE="10.10.10.20"

# Unique identifier for this sensor node
NODE_ID="sensor1"

# Maximum number of networks to buffer before oldest are dropped
BUFFER_MAX=500

# Number of retry attempts when sending fails
MAX_RETRIES=3

# Delay between retries in seconds
RETRY_DELAY=2

# Minimum seconds between reports to control node (throttling)
# With queue-based processing, we can go near real-time
REPORT_INTERVAL=2
